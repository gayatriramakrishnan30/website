{% extends "base.html" %}
{% from "_icons.html" import icon %}
{% set title = "Page not found" %}
{% block content %}
<section class="page-hero not-found">
  <div class="container">
    <p class="eyebrow">404</p>
    <h1 class="page-title">This page doesn't exist.</h1>
    <p class="page-lede">The link may be old or mistyped. Here are some good places to go instead:</p>
    <div class="hero-actions">
      <a class="btn btn-primary" href="/">Home {{ icon('arrow') }}</a>
      <a class="btn btn-ghost" href="/work/">All work</a>
      <a class="btn btn-ghost" href="/creative/">Creative work</a>
    </div>
  </div>
</section>
{% endblock %}
