about:
  - >-
    My path started in biotechnology and moved into neurobiology research at
    IISER Pune, where I ran more than 200 behavioural experiments on zebra
    finch song and learned to turn messy data into clear conclusions.
  - >-
    In Berlin I added a Life Science Management MBA at HTW Berlin. Since then
    I've worked on go-to-market strategy for a medical device at Charité,
    mapped funding across 50+ life-science startups for BioRN, and built a mock
    pre-seed medtech fund as a Venture Institute fellow.
  - >-
    Today I drive customer acquisition and strategic business development at
    Pensatech Pharma, working closely with its executives and advisory board.
    I also lead the new Platform & Community team at Nucleate Germany,
    connecting founder-scientists with investors, mentors and the wider
    European life-science ecosystem.
  - >-
    Outside of work you'll find me on a basketball court or at the piano.

