    link: { label: "@enactus_berlin", url: "https://www.instagram.com/enactus_berlin/" }
    text: >-
      Two to three posts a week for recruitment, events and project
      storytelling. I tracked posts in the KPI dashboard I built, and
      engagement grew 35% in four months.
    items:
      - type: carousel
        title: "Why join Enactus Berlin"
        caption: A recruitment carousel built from photos of past events.
        slides:
          - { src: enactus-join-1.webp, alt: "Why join Enactus Berlin, with event photos" }
