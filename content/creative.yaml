# ---------------------------------------------------------------------------
# Creative work gallery.
# Each item is one tile. Types:
#   image     -> `src`
#   carousel  -> `slides` (list of images; first one is the tile, all open in the viewer)
#   video     -> `src` (.mp4), optional `ratio` like "1/1" or "16/9"
#   document  -> `src` (cover image) + `file` (PDF opened in a new tab)
#   link      -> `src` (optional cover) + `url`
# All images live in static/media/creative/.
# ---------------------------------------------------------------------------

intro: >-
  Visual and written work from marketing roles, student initiatives,
  applications and coursework. I mostly design in Canva and Figma, illustrate
  in Krita, and edit video in CapCut.

groups:
  - id: testblu
    title: testblu diagnostics
    role: Marketing & BD student assistant · LinkedIn, Instagram, print
    text: >-
      Content and print materials for a Berlin diagnostics startup developing
      early cancer detection for dogs and cats. I kept the brand consistent
      across social posts, event announcements, a crowdfunding campaign and
      B2B material for veterinarians.
    items:
      - type: carousel
        title: Awareness series
        caption: Everyday dog moments that link back to early detection.
        slides:
          - { src: testblu-dog-2.webp, alt: "Silhouette of a dog jumping up to a person at sunset: Knowing early means caring longer" }
          - { src: testblu-dog-1.webp, alt: "Dog sitting at the beach at sunset: You can only treat early what you know early" }
          - { src: testblu-dog-3.webp, alt: "Dog waiting by a window: He waits for you, every day. His health doesn't" }
      - type: carousel
        title: Crowdfunding campaign
        caption: A five-slide carousel explaining the test and raising €19K for a validation study.
        slides:
          - { src: testblu-service-4.webp, alt: "Vet examining a dog: We're raising €19K to fund a cohort for our validation study" }
          - { src: testblu-service-1.webp, alt: "Black-and-white photo of an old dog: Cancer kills 50% of all dogs over the age of 10" }
          - { src: testblu-service-2.webp, alt: "Gloved hand examining a dog's fur: Why? Cancer grows inside and we cannot see it until symptoms appear" }
          - { src: testblu-service-3.webp, alt: "Lab pipette: Canisense detects cancer early, before symptoms appear" }
          - { src: testblu-service-5.webp, alt: "Happy Labrador: Early detection saves lives. Help fund our study, link in caption" }
      - type: carousel
        title: Event announcements
        caption: Posts for DMEA, GITEX Europe, Rooftop Pitch Potsdam / bio:cap and a monthly recap.
        slides:
          - { src: testblu-event-dmea.webp, alt: "We'll be at DMEA 2026, with the founders' portraits over Messe Berlin" }
          - { src: testblu-event-gitex.webp, alt: "testblu at GITEX Europe Berlin 2026, 30 June to 1 July" }
          - { src: testblu-event-june.webp, alt: "June events: Rooftop Pitch Potsdam 2026 and bio:cap Europe's biotech investival" }
          - { src: testblu-event-april.webp, alt: "April in review, with a dog raising its paw" }
      - type: carousel
        title: B2B flyer for veterinarians
        caption: A two-sided service flyer that explains the test workflow to vets, in German.
        slides:
          - { src: testblu-flyer-1.webp, alt: "Flyer front: About us and how the cancer screening works" }
          - { src: testblu-flyer-2.webp, alt: "Flyer back: test types, workflow and benefits" }
      - type: image
        title: Poster for pet owners
        caption: "Früher erkennen. Länger leben. Service awareness at clinics."
        src: testblu-poster.webp
        alt: "Poster with a dog: Früher erkennen. Länger leben. Krebsvorsorge-Test für Hunde und Katze"
      - type: image
        title: Hiring post
        caption: Recruiting a commercial co-founder for animal-health diagnostics.
        src: misc-commercial-cofounder.webp
        alt: "testblu: We are hiring a commercial co-founder, animal health diagnostics"
      - type: image
        title: Partner quote card
        caption: Quote post featuring the CEO of felmo, a mobile vet service.
        src: misc-felmo-quote.webp
        alt: Quote card from Philip Trockels, co-founder and CEO of felmo, in German

  - id: enactus
