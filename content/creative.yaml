          - { src: enactus-worldcup-1.webp, alt: "Enactus World Cup 2025, Team Germany" }
          - { src: enactus-worldcup-2.webp, alt: "This year: Enactus Münster! Team photos" }
          - { src: enactus-worldcup-3.webp, alt: "Next year: maybe you?" }
          - { src: enactus-worldcup-4.webp, alt: "Join Enactus Berlin, with a group photo" }
      - type: video
        title: "What does sustainability mean?"
        caption: A reel of members describing sustainability in one word.
        src: enactus-sustainability-reel.mp4
        ratio: "9/16"
      - type: image
        title: Sustainability fun fact
        caption: "Educational post: clean-energy investment hits $2.2 trillion in 2025."
        src: enactus-fun-fact.webp
        alt: "Teddy bear mascot with a speech bubble: Fun fact, in 2025 clean energy investment will hit $2.2 trillion"
      - type: image
        title: New semester
        caption: A seasonal post for the start of semester.
        src: enactus-new-semester.webp
