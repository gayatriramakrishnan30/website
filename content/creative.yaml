  - id: scicomm
    title: Science communication
    role: Applications & research outreach
    text: >-
      Turning technical concepts into clear visuals. Some of these were
      unsolicited samples made for job applications. I note where that's the
      case.
    items:
      - type: image
        title: Cell cultivation systems infographic
        caption: Compares culture flasks, roller bottles and multilayer flasks. A sample for an application to Green Elephant Biotech.
        src: scicomm-cell-cultivation.webp
        alt: Infographic comparing culture flask, roller bottle, multi-layer flask and CellScrew systems
      - type: image
        title: International Day of Women in Science
        caption: A LinkedIn graphic made as an application sample for FyoniBio.
        src: scicomm-women-in-science.webp
        alt: Illustrated poster of women scientists and an astronaut, International Day of Women and Girls in Science
      - type: carousel
        title: Zebra finch illustrations
        caption: Hand-drawn in Krita to explain my thesis set-up on directed song to non-specialists.
        slides:
          - { src: scicomm-zebrafinch-song.webp, alt: Illustration of a male zebra finch singing to a female }
          - { src: scicomm-zebrafinch-male.webp, alt: Illustration of a male zebra finch }
          - { src: scicomm-zebrafinch-female.webp, alt: Illustration of a female zebra finch }
      - type: image
        title: SortSmart pitch visual
        caption: Concept graphic for the Enactus SortSmart pitch.
        src: scicomm-smartsort.webp
        alt: Icon of a question-mark bin sorting into bottle, paper and food-waste bins

  - id: academic
    title: Academic & hackathon work
    role: Coursework and hackathons
    text: Explainer videos, posters and concept maps from university and hackathons.
    items:
      - type: video
        title: Direct carbonation, in four steps
        caption: A Python-generated explainer for the Flycarb greenCHEM hackathon pitch.
        src: academic-direct-carbonation.mp4
        ratio: "16/9"
      - type: video
        title: The gut health story
        caption: Product storytelling video for the GutGlow synbiotics presentation (Canva, CapCut).
        src: academic-gut-health.mp4
        ratio: "16/9"
      - type: image
        title: Stem cell-based therapy infographic
        caption: Group poster on stem cell therapy for neurodegenerative diseases and diabetes.
        src: academic-stem-cell-therapy.webp
        alt: Academic infographic on stem cell-based therapy for neurodegenerative diseases and diabetes
      - type: image
        title: lac operon poster
        caption: An educational poster on gene regulation in E. coli.
        src: academic-lac-operon.webp
        alt: Academic poster explaining the lac operon
      - type: document
        title: Alternative lengthening of telomeres
        caption: A concept map built in Coggle.
        src: academic-alt-mindmap.webp
        file: /static/docs/academic-alt-mindmap.pdf
        alt: Mind map of the alternative lengthening of telomeres mechanism, markers and therapies

  - id: writing
    title: Writing
    role: Blogs and articles
    text: >-
      I write about science and the biotech industry for non-specialist
      readers, from lab techniques to market trends.
    items:
      - type: document
        title: "Choosing the right cell cultivation system"
        caption: A blog article comparing culture flasks, roller bottles and multilayer flasks.
        src: writing-cell-cultivation.webp
        file: /static/docs/writing-cell-cultivation.pdf
        alt: First page of a blog article on choosing a cell cultivation system
      - type: link
        title: "SciXplore: Dr. Jayant Bhalchandra Udgaonkar"
        caption: An article for SciXplore, the student science blog (2021).
        url: https://scixplore.wordpress.com/2021/09/26/dr-jayant-bhalchandra-udgaonkar/
