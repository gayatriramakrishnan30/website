          - { src: enactus-teams-6.webp, alt: "Events: bringing everyone together" }
          - { src: enactus-teams-7.webp, alt: "Marketing & Web Design: shaping how we look and sound" }
          - { src: enactus-teams-8.webp, alt: "Whatever your skill, there's a team for you. Applications open" }
